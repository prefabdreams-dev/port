<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate Me - Frosty Lobo</title>
    <style>
        @font-face {
            font-family: 'MyCustomFont';
            src: url('font.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --text-main: #32a4ff;
            --text-muted: #4a5c6a;
            --accent: #0066cc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'MyCustomFont', sans-serif; 
            color: var(--text-main);
            min-height: 100vh;
            background: 
                radial-gradient(circle at 15% 50%, rgba(135, 206, 250, 0.4), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(176, 224, 230, 0.6), transparent 50%),
                linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .aero-glass {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.5) 0%,
                rgba(255, 255, 255, 0.2) 100%
            );
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                0 8px 32px 0 rgba(31, 38, 135, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 1),
                inset 0 -1px 2px rgba(255,255,255, 0.3);
            border-radius: 16px;
        }

        .donation-container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 2rem;
        }

        .back-btn {
            position: absolute;
            left: 0;
            text-decoration: none;
            color: var(--accent);
            font-weight: bold;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            text-align: center;
            color: var(--accent);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .qr-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .qr-image {
            width: 260px;
            height: 260px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 24px rgba(31, 38, 135, 0.1);
            background: #fff;
        }

        .download-btn {
            background: linear-gradient(135deg, #0066cc 0%, #32a4ff 100%);
            color: #ffffff;
            border: none;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'MyCustomFont', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 102, 204, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 204, 0.4);
        }

        .download-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="donation-container aero-glass">
        <header>
            <a href="http://frostylobo.xo.je/" class="back-btn">&larr; Back</a>
            <h1>Donate Me</h1>
        </header>

        <div class="qr-wrapper">
            <img src="https://files.catbox.moe/3n9xz5.jpg" alt="Donation QR Code" class="qr-image" id="qrImage" crossorigin="anonymous">
            <button class="download-btn" id="downloadBtn">
