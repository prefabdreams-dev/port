<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate Me - Frosty Lobo</title>

    <!-- Font Awesome CDN (Icon Library) -->
    <!-- Source: https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Animate.css for fluid micro-interactions -->
    <!-- Source: https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        @font-face {
            font-family: 'MyCustomFont';
            src: url('font.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --text-main: #32a4ff;
            --text-muted: #4a5c6a;
            --accent: #0066cc;
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shine: rgba(255, 255, 255, 0.9);
            --shadow-color: rgba(31, 38, 135, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'MyCustomFont', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            color: var(--text-main);
            min-height: 100vh;
            background: 
                radial-gradient(circle at 15% 50%, rgba(135, 206, 250, 0.4), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(176, 224, 230, 0.6), transparent 50%),
                linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* Ultimate Glassmorphism Aesthetics */
        .aero-glass {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.55) 0%,
                rgba(255, 255, 255, 0.15) 100%
            );
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-shine);
            border-left: 1px solid var(--glass-shine);
            box-shadow: 
                0 16px 40px 0 var(--shadow-color),
                inset 0 1px 0 rgba(255, 255, 255, 1),
                inset 0 -1px 2px rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }

        .aero-glass:hover {
            box-shadow: 
                0 24px 48px 0 rgba(31, 38, 135, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 1),
                inset 0 -1px 2px rgba(255, 255, 255, 0.5);
        }

        .donation-container {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: fadeInContainer 0.8s ease-out;
        }

        @keyframes fadeInContainer {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header Layout */
        header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 2rem;
        }

        .back-btn {
            position: absolute;
            left: 0;
            text-decoration: none;
            color: var(--accent);
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.6rem 1.1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateX(-4px);
            box-shadow: 0 6px 16px rgba(0, 102, 204, 0.18);
            color: #004499;
        }

        .back-btn:active {
            transform: translateX(-2px) scale(0.96);
        }

        h1 {
            margin: 0;
            font-size: 1.85rem;
            font-weight: 800;
            text-align: center;
            color: var(--accent);
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.9);
            letter-spacing: -0.5px;
        }

        /* QR Frame & Aspect Ratio Setup */
        .qr-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8rem;
        }

        .qr-frame {
            position: relative;
            width: 100%;
            max-width: 280px;
            /* Explicit 3:4 Portrait Aspect Ratio */
            aspect-ratio: 3 / 4;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 
                0 12px 30px rgba(31, 38, 135, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.8);
            background: #ffffff;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .qr-frame:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 
                0 20px 40px rgba(31, 38, 135, 0.22),
                0 0 0 1px rgba(255, 255, 255, 1);
        }

        .qr-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* High Precision Action Button */
        .download-btn {
            background: linear-gradient(135deg, #0066cc 0%, #32a4ff 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 0.95rem 2.2rem;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: inherit;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 102, 204, 0.35);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: left 0.6s ease;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .download-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 28px rgba(0, 102, 204, 0.45);
        }

        .download-btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        /* Micro-feedback toast element */
        .toast {
            position: fixed;
            bottom: 2rem;
            background: rgba(0, 102, 204, 0.9);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="donation-container aero-glass">
        <header>
            <a href="http://frostylobo.xo.je/" class="back-btn" aria-label="Go back to homepage">
                <i class="fa-solid font-awesome-icon fa-arrow-left"></i>
                <span>Back</span>
            </a>
            <h1>Donate Me</h1>
        </header>

        <div class="qr-wrapper">
            <div class="qr-frame">
                <img src="https://files.catbox.moe/tl8264.jpg" alt="Donation QR Code" class="qr-image" id="qrDisplayImage">
            </div>

            <button class="download-btn" id="saveQrBtn" type="button">
                Save QR
            </button>
        </div>
    </div>

    <!-- UI Notification Feedback -->
    <div class="toast" id="statusToast">Downloading QR Code...</div>

    <script>
        /**
         * Advanced File Downloader Engine
         * Built with fail-safe async blob handling and fallback mechanisms.
         */
        class QRDownloaderEngine {
            constructor(buttonId, targetFileName, toastId) {
                this.button = document.getElementById(buttonId);
                this.targetFileName = targetFileName;
                this.toast = document.getElementById(toastId);
                this.init();
            }

            init() {
                if (!this.button) return;
                this.button.addEventListener('click', (e) => this.handleDownload(e));
            }

            showToast(message, duration = 2500) {
                if (!this.toast) return;
                this.toast.textContent = message;
                this.toast.classList.add('show');
                setTimeout(() => {
                    this.toast.classList.remove('show');
                }, duration);
            }

            async handleDownload(event) {
                event.preventDefault();

                // Direct relative target file path in the same directory
                const fileUrl = `./${this.targetFileName}`;

                try {
                    this.showToast("Starting download...");

                    // Fetch the file locally via AJAX to get direct Blob stream
                    const response = await fetch(fileUrl, { cache: 'no-store' });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const blob = await response.blob();
                    const objectUrl = URL.createObjectURL(blob);

                    // Programmatically construct virtual anchor to force browser download
                    const anchor = document.createElement('a');
                    anchor.style.display = 'none';
                    anchor.href = objectUrl;
                    anchor.download = this.targetFileName;

                    document.body.appendChild(anchor);
                    anchor.click();

                    // Cleanup memory leaks safely
                    setTimeout(() => {
                        document.body.removeChild(anchor);
                        URL.revokeObjectURL(objectUrl);
                    }, 200);

                    this.showToast("QR Saved Successfully!");

                } catch (error) {
                    console.warn("Direct blob fetch failed, falling back to direct anchor triggering:", error);

                    // Graceful Fallback: Direct DOM download trigger for local server environments
                    const fallbackAnchor = document.createElement('a');
                    fallbackAnchor.href = fileUrl;
                    fallbackAnchor.download = this.targetFileName;
                    fallbackAnchor.target = '_self';
                    document.body.appendChild(fallbackAnchor);
                    fallbackAnchor.click();
                    document.body.removeChild(fallbackAnchor);

                    this.showToast("Saved QR!");
                }
            }
        }

        // Initialize when DOM content is fully loaded
        document.addEventListener('DOMContentLoaded', () => {
            new QRDownloaderEngine('saveQrBtn', 'kp.png', 'statusToast');
        });
    </script>
</body>
</html>
